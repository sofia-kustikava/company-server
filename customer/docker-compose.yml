version: '2'
services:
  db:
    image: 'postgres:13.1-alpine'
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5431:5432"
    networks:
      - spring-network
    volumes:
      - /postgres-data:/var/lib/postgresql/data
      - ./database/CreateDB.sql:/docker-entrypoint-initdb.d/Create.sql
  mic:
    image: 'postgres:13.1-alpine'
    container_name: mic
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5433:5432"
    networks:
      - spring-network
    volumes:
      - ./finnhub/postgres-data:/var/lib/postgresql/data
      - ./finnhub/finnhub-database/CreateDB.sql:/docker-entrypoint-initdb.d/Create.sql

  finnhub-server:
    container_name: app
    build: finnhub
    ports:
      - "8081:8081"
    networks:
      - spring-network
    depends_on:
      - "mic"

networks:
  spring-network:
    driver: bridge